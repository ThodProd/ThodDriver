[package]
name = "thod-driver"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_UpdateAgent",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
