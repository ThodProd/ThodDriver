name: Сборка и выпуск ThodDriver

on:
  workflow_dispatch:
  push:
    tags:
      - 'hub-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Подготовить и собрать приложение
        shell: pwsh
        run: |
          & .\tools\generate-icon.ps1 -OutputPath (Join-Path $PWD 'assets\thoddriver.ico')
          cargo build --release
      - name: Подготовить пакет
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'thoddriver-stage'
          New-Item -ItemType Directory -Force -Path "$stage/app" | Out-Null
          Copy-Item hub/manifest.json "$stage/manifest.json"
          Copy-Item target/release/ThodDriver.exe "$stage/app/ThodDriver.exe"
          git clone --depth 1 https://github.com/ThodProd/ThodHUB.git "$env:RUNNER_TEMP/ThodHUB"
          & "$env:RUNNER_TEMP/ThodHUB/scripts/package-module.ps1" -PackageDirectory $stage -Repository ThodProd/ThodDriver -OutputDirectory dist -Notes 'Отдельное приложение с корректным запросом прав администратора, иконкой EXE и ярлыка. Поиск и установка драйверов через Windows Update.'
      - name: Опубликовать стабильный выпуск
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $manifest = Get-Content hub/manifest.json -Raw | ConvertFrom-Json
          $tag = "hub-v$($manifest.version)"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Выпуск $tag уже существует: старые assets заменять нельзя." }
          gh release create $tag dist/*.zip dist/thodhub-release.json --title $tag --notes 'Отдельное приложение с корректным запросом прав администратора, иконкой EXE и ярлыка. Поиск и установка драйверов через Windows Update.'
